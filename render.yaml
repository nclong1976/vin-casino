services:
  - type: web
    name: vin-casino
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Bắt buộc - lấy từ Supabase Dashboard > Project Settings > API.
      # sync: false nghĩa là Render sẽ yêu cầu bạn tự nhập giá trị thật
      # trong Dashboard (không lưu giá trị thật trong repo Git).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Tùy chọn - đã có giá trị mặc định hardcode trong src/lib/firebase.js,
      # chỉ cần khai báo nếu muốn dùng project Firebase khác.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
