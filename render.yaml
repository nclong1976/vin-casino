services:
  - type: web
    name: vin-casino
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Bắt buộc - lấy từ Supabase Dashboard > Project Settings > API.
      # sync: false nghĩa là Render sẽ yêu cầu bạn tự nhập giá trị thật
      # trong Dashboard (không lưu giá trị thật trong repo Git).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Bắt buộc CHỈ CHO tính năng cộng lãi hàng ngày theo cấp VIP
      # (server.ts gọi RPC credit_daily_interest_batch). KHÔNG dùng tiền tố
      # VITE_ - key này không bao giờ được lộ ra trình duyệt. Lấy trong
      # Supabase Dashboard > Project Settings > API > "service_role" secret.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Cầu nối CSKH <-> Telegram KHÔNG còn chạy ở server.ts/Render nữa - đã
      # chuyển sang Supabase Edge Functions (telegram-cskh-outbound,
      # telegram-webhook) + Database Webhook, cấu hình TELEGRAM_BOT_TOKEN/
      # TELEGRAM_CHAT_ID/TELEGRAM_WEBHOOK_SECRET như Edge Function secrets
      # trong Supabase Dashboard, không phải ở đây. Duyệt Nạp/Rút qua Telegram
      # đã bị gỡ bỏ hoàn toàn - chỉ còn duyệt trong Admin Panel.
