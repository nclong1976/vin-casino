services:
  - type: web
    name: vin-casino
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Bắt buộc - lấy từ Supabase Dashboard > Project Settings > API.
      # sync: false nghĩa là Render sẽ yêu cầu bạn tự nhập giá trị thật
      # trong Dashboard (không lưu giá trị thật trong repo Git).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Bắt buộc CHỈ CHO tính năng cộng lãi hàng ngày theo cấp VIP
      # (server.ts gọi RPC credit_daily_interest_batch). KHÔNG dùng tiền tố
      # VITE_ - key này không bao giờ được lộ ra trình duyệt. Lấy trong
      # Supabase Dashboard > Project Settings > API > "service_role" secret.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Tùy chọn - cầu nối CSKH + Nạp/Rút tiền <-> Telegram (server.ts): chat
      # CSKH hai chiều, và lệnh nạp/rút mới forward vào nhóm kèm nút Phê
      # duyệt/Từ chối để Admin xử lý ngay trên Telegram. Tạo bot qua
      # @BotFather, lấy CHAT_ID bằng cách thêm bot vào nhóm CSKH rồi gọi
      # https://api.telegram.org/bot<TOKEN>/getUpdates. Không cấu hình thì
      # tính năng tự tắt. RENDER_EXTERNAL_URL đã tự có sẵn trên Render nên
      # KHÔNG cần khai báo TELEGRAM_WEBHOOK_URL riêng.
      # Để MỖI KHÁCH HÀNG có 1 topic riêng trong nhóm (thay vì tin nhắn mọi
      # khách đan xen chung 1 luồng): mở nhóm Telegram > Chỉnh sửa nhóm > bật
      # "Topics" (yêu cầu nhóm ở dạng Supergroup) TRƯỚC khi thêm bot vào -
      # server.ts tự tạo 1 topic/khách khi khách nhắn tin lần đầu, Admin gõ
      # thẳng trong topic đó để trả lời (không cần bấm Reply). Nếu không bật
      # Topics, tính năng CSKH <-> Telegram vẫn hoạt động bình thường như cũ
      # (1 luồng chung), chỉ là không phân loại theo khách.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
