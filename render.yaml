services:
  - type: web
    name: vin-casino
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      # Bắt buộc - lấy từ Supabase Dashboard > Project Settings > API.
      # sync: false nghĩa là Render sẽ yêu cầu bạn tự nhập giá trị thật
      # trong Dashboard (không lưu giá trị thật trong repo Git).
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Thông báo đẩy (Web Push) cho quản trị viên - đây là VAPID PUBLIC key,
      # an toàn để đặt thẳng giá trị thật ở đây (không phải secret, sẽ luôn
      # lộ ra trong bundle client dù có giấu cách nào). PHẢI khớp đúng
      # VAPID_PUBLIC_KEY cấu hình trong Supabase Edge Function Secrets (xem
      # migration 20260919090000_admin_push_notifications.sql).
      - key: VITE_VAPID_PUBLIC_KEY
        value: BN8zRiHZ3UoMEzCqTorSy4YvOoqSAfkfUwGsf2oHQ-jgJNOAsDDpGF7PBi3u4tnwrs2seLEYJMYth15VJBSvTwQ
      # Job cộng lãi hàng ngày theo cấp VIP KHÔNG còn chạy ở server.ts/Render
      # nữa - đã chuyển sang pg_cron chạy thẳng trong Postgres (Supabase
      # Dashboard > Database > Cron Jobs, job "credit-daily-interest", xem
      # migration 20260915090000_daily_interest_pg_cron.sql). SUPABASE_URL/
      # SUPABASE_SERVICE_ROLE_KEY không còn được server.ts dùng tới nữa.
      # Cầu nối CSKH <-> Telegram đã bị gỡ bỏ hoàn toàn (xem migration
      # 20260915120000_remove_telegram_bridge.sql) - CSKH chỉ còn chạy trong
      # Admin Panel/app, không đồng bộ sang Telegram nữa.
