name: Node.js CI & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 20.x: API webidl noi bo cua undici thieu markAsUncloneable(),
        # khien jsdom (moi truong test, xem vitest.config.js) crash ngay luc
        # khoi dong voi loi "webidl.util.markAsUncloneable is not a function"
        # - loi tuong thich da biet giua jsdom/undici va Node 20, khong lien
        # quan gi den code test that. Node 22.x (LTS dang duoc ho tro) khong
        # dinh loi nay.
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # Bộ dàn trang văn bản (src/shared/docLayout) được chép sang
      # supabase/functions/_shared/docLayout cho Edge Function - bản chép
      # phải khớp nguồn (chạy npm run sync:shared nếu bước này báo lỗi).
      - name: Check shared docLayout copy
        run: npm run check:shared

      - name: Use Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Bảo đảm bản chép chạy được trên runtime của Supabase Edge Functions.
      - name: Type-check Edge Function shared code
        run: deno check supabase/functions/_shared/docLayout/index.ts

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build
