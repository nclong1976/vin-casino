name: Node.js CI & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 20.x: API webidl noi bo cua undici thieu markAsUncloneable(),
        # khien jsdom (moi truong test, xem vitest.config.js) crash ngay luc
        # khoi dong voi loi "webidl.util.markAsUncloneable is not a function"
        # - loi tuong thich da biet giua jsdom/undici va Node 20, khong lien
        # quan gi den code test that. Node 22.x (LTS dang duoc ho tro) khong
        # dinh loi nay. Chi doi Node cho buoc CI/test - khong dung Node cua
        # Render (render.yaml van giu NODE_VERSION rieng cho production).
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm run test

      - name: Build project
        run: npm run build
